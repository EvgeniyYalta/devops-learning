services:

  backend:
    image: hashicorp/http-echo:1.0.0
    command: ["-text=Day 24 Backend OK", "-listen=:5678"]
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "8089:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  app-network:
    driver: bridge
