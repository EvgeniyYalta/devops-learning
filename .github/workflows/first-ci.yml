name: First DevOps CI

# Запуск при отправке изменений в main
on:
  push:
    branches:
      - main

jobs:
  # Первое задание
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "CI pipeline started"
          pwd
          ls -la
          uname -a

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: |
          # Проверяем конфигурацию проекта Дня 24
          docker compose -f docker/day24-final-project/compose.yaml config --quiet

          # Сообщение выводится только при успешной проверке
          echo "Docker Compose configuration is valid"

      - name: Test Bash file checker
        run: |
          # Проверяем синтаксис скрипта
          bash -n ci/scripts/file_check.sh

          # Создаём тестовый файл
          touch test-existing.txt

          # Проверяем успешный сценарий
          output=$(bash ci/scripts/file_check.sh test-existing.txt)
          echo "$output"
          echo "$output" | grep -q "OK: file exists"

          # Проверяем сценарий отсутствующего файла
          output=$(bash ci/scripts/file_check.sh test-missing.txt)
          echo "$output"
          echo "$output" | grep -q "ERROR: file not found"

          # Удаляем тестовый файл
          rm test-existing.txt

      - name: Verify CI recovery
        run: |
          echo "Testing CI recovery"
          exit 0

      - name: Report success
        if: success()
        run: echo "All CI checks passed"

      - name: Report failure
        if: failure()
        run: echo "CI pipeline failed"

      - name: Finish
        run: echo "CI pipeline completed successfully"


  validation:
    needs: basic-check
    runs-on: ubuntu-latest

    steps:
      - name: Validate dependency
        run: |
          echo "Basic checks completed successfully"
          echo "Validation job started"
