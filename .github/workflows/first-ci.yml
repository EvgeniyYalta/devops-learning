name: First DevOps CI

env:
  APP_NAME: devops-learning
  APP_ENV: testing
  CI_VERSION: "1.0"
  DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}

# Запуск при отправке изменений в main
on:
  push:
    branches:
      - main

jobs:
  # Первое задание
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "CI pipeline started"
          pwd
          ls -la
          uname -a
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"
          echo "CI version: $CI_VERSION"
          echo "Deploy environment: $DEPLOY_ENV"

       - name: Verify repository secret
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          # Проверяем наличие секрета, не выводя его значение
          if [ -n "$DEMO_API_TOKEN" ]; then
            echo "Repository secret is available"
          else
            echo "ERROR: Repository secret is missing"
            exit 1
          fi

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: |
          # Проверяем конфигурацию проекта Дня 24
          docker compose -f docker/day24-final-project/compose.yaml config --quiet

          # Сообщение выводится только при успешной проверке
          echo "Docker Compose configuration is valid"

      - name: Test Bash file checker
        run: |
          # Проверяем синтаксис скрипта
          bash -n ci/scripts/file_check.sh

          # Создаём тестовый файл
          touch test-existing.txt

          # Проверяем успешный сценарий
          output=$(bash ci/scripts/file_check.sh test-existing.txt)
          echo "$output"
          echo "$output" | grep -q "OK: file exists"

          # Проверяем сценарий отсутствующего файла
          output=$(bash ci/scripts/file_check.sh test-missing.txt)
          echo "$output"
          echo "$output" | grep -q "ERROR: file not found"

          # Удаляем тестовый файл
          rm test-existing.txt

      - name: Generate CI report
        run: |
          # Создаём отчёт о проверке Bash
          bash ci/scripts/generate_report.sh

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: bash-test-report
          path: ci/reports/test-report.txt
          if-no-files-found: error

      - name: Verify CI recovery
        run: |
          echo "Testing CI recovery"
          exit 0

      - name: Report success
        if: success()
        run: echo "All CI checks passed"

      - name: Report failure
        if: failure()
        run: echo "CI pipeline failed"

      - name: Finish
        run: echo "CI pipeline completed successfully"


  validation:
    needs: basic-check
    runs-on: ubuntu-latest

    env:
      VALIDATION_MODE: strict

    steps:
      - name: Validate dependency
        run: |
          echo "Basic checks completed successfully"
          echo "Validation job started"
          echo "Validation mode: $VALIDATION_MODE"
